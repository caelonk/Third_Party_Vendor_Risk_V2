name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vendor_risk
          POSTGRES_PASSWORD: vendor_risk
          POSTGRES_DB: vendor_risk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vendor_risk"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Used only by the Alembic Postgres-verification step below.
      ALEMBIC_DATABASE_URL: postgresql+psycopg://vendor_risk:vendor_risk@localhost:5432/vendor_risk_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy core app

      - name: Test (pytest, offline/SQLite)
        run: pytest

      - name: Verify migration on PostgreSQL
        run: |
          alembic upgrade head
          alembic check          # models must match the migration
          alembic downgrade base
