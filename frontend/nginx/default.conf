# SPA + same-origin API proxy. Same origin means the httpOnly auth cookies just
# work and no CORS is needed in production.

# JSON access log. $request_id is also forwarded to the API as X-Request-ID, so
# an nginx line and the app's log lines for one request share the same id.
# $uri excludes the query string (search terms/tokens never reach the logs).
log_format json escape=json '{"ts":"$time_iso8601","logger":"nginx.access",'
    '"request_id":"$request_id","http_method":"$request_method","http_path":"$uri",'
    '"http_status":$status,"duration_s":$request_time,"bytes":$body_bytes_sent,'
    '"upstream_s":"$upstream_response_time"}';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log /dev/stdout json;

    client_max_body_size 12m;  # SBOM uploads (the API itself caps at 10 MB)

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 160s;  # on-demand sync makes paced NVD calls
    }

    # Fingerprinted build assets never change under the same name.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else is the SPA: always revalidate index.html so deploys land.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
