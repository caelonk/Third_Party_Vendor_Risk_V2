# Full stack: postgres, redis, MinIO (S3-compatible export storage), a one-shot
# migrate job, the API (gunicorn + uvicorn workers), Celery worker + beat, and
# nginx serving the SPA and proxying /api on the same origin.
# Open http://localhost:8080.
#
#   docker compose up --build -d
#   FLOWER_BASIC_AUTH=admin:change-me docker compose --profile ops up -d flower
#
# Published ports bind to 127.0.0.1: Docker otherwise publishes on every
# interface, bypassing the host firewall.

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://vendor_risk:vendor_risk@postgres:5432/vendor_risk
  REDIS_URL: redis://redis:6379/0
  LOG_FORMAT: ${LOG_FORMAT:-json}
  # Where browsers reach the app; OAuth redirect URIs are built from it.
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
  # "Continue with Google" uses a built-in stand-in until GOOGLE_CLIENT_ID and
  # GOOGLE_CLIENT_SECRET are set in .env (real credentials always win, and the
  # stand-in is refused when ENV=production).
  OIDC_DEV_PROVIDER: ${OIDC_DEV_PROVIDER:-true}
  # Exports: workers write to MinIO over the compose network; download links are
  # signed for the address a browser uses (a signature covers the Host header).
  EXPORT_STORAGE: s3
  EXPORT_RUN_INLINE: "false"
  S3_ENDPOINT_URL: http://minio:9000
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
  S3_BUCKET: ${S3_BUCKET:-vendor-risk-exports}
  S3_CREATE_BUCKET: "true"
  # Dev only: the app uses MinIO's root account. In production, point S3_* at a
  # managed store with a key scoped to this one bucket.
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-vendorrisk}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-vendorrisk-dev-only}

x-backend: &backend
  build: .
  env_file: .env
  environment: *backend-env
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vendor_risk
      POSTGRES_PASSWORD: vendor_risk
      POSTGRES_DB: vendor_risk
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendor_risk"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for exports: a local stand-in for AWS S3 / R2.
  # MinIO no longer publishes community images; this is the last one released,
  # pinned. It serves local development only.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vendorrisk}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vendorrisk-dev-only}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"  # S3 API: signed download links point here
      - "127.0.0.1:9001:9001"  # web console
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs migrations once per deploy; api/worker/beat start only after it succeeds,
  # so scaling the API never races concurrent `alembic upgrade`s.
  migrate:
    <<: *backend
    command: alembic upgrade head
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    # Image CMD: gunicorn -c gunicorn.conf.py app.main:app
    ports:
      - "127.0.0.1:8000:8000"  # direct access for the Vite dev server; nginx is the front door
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Incremental syncs, export rendering, and the dispatcher ("celery" default queue).
  worker:
    <<: *backend
    command: >
      celery -A app.workers.celery_app.celery_app worker --loglevel=info
      -Q celery,sync --hostname=sync@%h --concurrency=${WORKER_CONCURRENCY:-4}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy  # renders exports into it

  # A product's first (expensive) pull. Its own worker, so a large import can
  # never occupy the slots that keep existing vendors current; it also draws NVD
  # tokens with a reserve (app.services.nvd_limits).
  worker-backfill:
    <<: *backend
    command: >
      celery -A app.workers.celery_app.celery_app worker --loglevel=info
      -Q backfill --hostname=backfill@%h --concurrency=${BACKFILL_CONCURRENCY:-1}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    <<: *backend
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy

  # Queue dashboard. Opt-in (profile "ops") and refuses to start without auth.
  flower:
    <<: *backend
    profiles: ["ops"]
    restart: on-failure:3  # bounded: a missing password must not crash-loop forever
    environment:
      <<: *backend-env
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:-}
    command: >
      sh -c 'test -n "$$FLOWER_BASIC_AUTH" || { echo "Set FLOWER_BASIC_AUTH=user:password to run Flower." >&2; exit 1; };
             exec celery -A app.workers.celery_app.celery_app flower --port=5555 --basic-auth="$$FLOWER_BASIC_AUTH"'
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  minio-data:
