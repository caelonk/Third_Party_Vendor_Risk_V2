[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vendor-risk"
version = "0.1.0"
description = "Multi-tenant third-party vendor vulnerability risk platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "email-validator>=2",
    "celery>=5.3",
    "redis>=5.0",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "cryptography>=42",
    "requests>=2.31",
    "weasyprint>=61",
    "sentry-sdk>=2.0",      # inert unless SENTRY_DSN is set
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "httpx>=0.27",          # FastAPI TestClient
    "ruff>=0.4",
    "mypy>=1.9",
    "types-requests",
]

[tool.setuptools]
packages = ["core", "seed", "app"]

# --------------------------------------------------------------------------- #
# Tooling                                                                      #
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length is handled by the formatter, not enforced hard

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are designed to be called in argument defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Cookie",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
    "app.deps.require_role",
]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["migrations/", "seed/"]
